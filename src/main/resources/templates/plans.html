<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Plans · Orbit</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: sidebar}"></div><main class="main">
<header class="topbar"><div><div class="eyebrow">CATALOG / PLANS</div><h1>Subscription plans</h1><p class="muted">Set billing frequency, price and availability.</p></div><button class="theme-btn" onclick="toggleTheme()">◐ Theme</button></header>
<div th:if="${success}" class="alert success" th:text="${success}"></div><section class="panel"><h2>Create plan</h2><form class="form-grid" method="post" action="/plans"><input name="name" placeholder="Plan name" required><select name="interval"><option value="DAILY">Daily</option><option value="WEEKLY">Weekly</option><option value="MONTHLY" selected>Monthly</option><option value="YEARLY">Yearly</option></select><input name="price" type="number" min="0" step=".01" placeholder="Price" required><input name="minimumQuantity" type="number" min="1" value="1" placeholder="Minimum quantity"><label class="check"><input type="checkbox" name="autoClose" value="true"> Auto-close at end</label><button class="primary-btn">Save plan</button></form></section>
<section class="panel"><h2>Available plans</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Interval</th><th>Price</th><th>Min quantity</th><th>Auto close</th></tr></thead><tbody><tr th:each="p:${plans}"><td th:text="${p.name}"></td><td th:text="${p.interval}"></td><td th:text="${p.price}"></td><td th:text="${p.minimumQuantity}"></td><td th:text="${p.autoClose ? 'Yes' : 'No'}"></td></tr><tr th:if="${#lists.isEmpty(plans)}"><td colspan="5" class="empty">No plans created.</td></tr></tbody></table></div></section></main><script src="/js/app.js"></script></body></html>
