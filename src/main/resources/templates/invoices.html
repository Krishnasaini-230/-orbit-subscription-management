<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Invoices · Orbit</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: sidebar}"></div><main class="main">
<header class="topbar"><div><div class="eyebrow">FINANCE / BILLING</div><h1>Invoices & payments</h1><p class="muted">Track balances and record incoming payments.</p></div><button class="theme-btn" onclick="toggleTheme()">◐ Theme</button></header>
<div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div>
<section class="panel"><h2>Invoice register</h2><div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Invoice date</th><th>Due date</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th>Record payment</th></tr></thead><tbody><tr th:each="i:${invoices}"><td th:text="'INV-'+${i.id}"></td><td th:text="${i.customer.name}"></td><td th:text="${i.invoiceDate}"></td><td th:text="${i.dueDate}"></td><td th:text="${i.total}"></td><td th:text="${i.amountPaid}"></td><td th:text="${i.outstanding}"></td><td><span class="pill" th:text="${i.status}"></span></td><td><form th:if="${i.outstanding.compareTo(T(java.math.BigDecimal).ZERO)>0}" th:action="@{/invoices/{id}/payments(id=${i.id})}" method="post" class="payment-form"><input type="number" name="amount" min=".01" step=".01" th:attr="max=${i.outstanding}" placeholder="Amount" required><select name="method"><option>UPI</option><option>Bank Transfer</option><option>Card</option><option>Cash</option></select><button class="small-btn">Record</button></form></td></tr><tr th:if="${#lists.isEmpty(invoices)}"><td colspan="9" class="empty">No invoices yet. Activate a subscription and generate one from the overview.</td></tr></tbody></table></div></section></main><script src="/js/app.js"></script></body></html>
