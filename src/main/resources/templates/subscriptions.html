
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Subscriptions · Orbit</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div th:replace="~{fragments :: sidebar}"></div>

<main class="main">

    <header class="topbar">
        <div>
            <div class="eyebrow">REVENUE / SUBSCRIPTIONS</div>
            <h1>Subscriptions</h1>
            <p class="muted">Manage the customer subscription lifecycle.</p>
        </div>
        <button class="theme-btn" onclick="toggleTheme()">◐ Theme</button>
    </header>

    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <section class="panel">
        <h2>Create subscription</h2>

        <form class="form-grid" method="post" action="/subscriptions">

            <select name="customerId" required>
                <option value="">Select customer</option>
                <option th:each="c : ${customers}"
                        th:value="${c.id}"
                        th:text="${c.name}">
                </option>
            </select>

            <select name="planId" required>
                <option value="">Select plan</option>
                <option th:each="p : ${plans}"
                        th:value="${p.id}"
                        th:text="${p.name+' · '+p.price+'/'+p.interval}">
                </option>
            </select>

            <input type="number" name="quantity" min="1" value="1" required>

            <button class="primary-btn">Create draft</button>
        </form>
    </section>

    <section class="panel">
        <h2>All subscriptions</h2>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Reference</th>
                    <th>Customer</th>
                    <th>Plan</th>
                    <th>Qty</th>
                    <th>Status</th>
                    <th>Update status</th>
                    <th>Invoice</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="s : ${subscriptions}">

                    <td th:text="'SUB-'+${s.id}"></td>
                    <td th:text="${s.customer.name}"></td>
                    <td th:text="${s.plan.name}"></td>
                    <td th:text="${s.quantity}"></td>

                    <td>
                        <span class="pill" th:text="${s.status}"></span>
                    </td>

                    <td>
                        <form th:action="@{/subscriptions/{id}/transition(id=${s.id})}"
                              method="post"
                              class="inline-form">

                            <select name="status">
                                <option th:each="st : ${statuses}"
                                        th:value="${st}"
                                        th:text="${st}"
                                        th:selected="${st == s.status}">
                                </option>
                            </select>

                            <button class="small-btn">Update</button>
                        </form>
                    </td>

                    <td>
                        <form th:if="${s.status.name() == 'ACTIVE'}"
                              th:action="@{/subscriptions/{id}/invoice(id=${s.id})}"
                              method="post">

                            <button class="small-btn">
                                Generate Invoice
                            </button>
                        </form>

                        <span th:unless="${s.status.name() == 'ACTIVE'}"
                              class="muted">
                                Activate first
                            </span>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(subscriptions)}">
                    <td colspan="7" class="empty">
                        No subscriptions yet.
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </section>

</main>

<script src="/js/app.js"></script>

</body>
</html>
