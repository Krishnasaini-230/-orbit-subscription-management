<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Customers · Orbit</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: sidebar}"></div><main class="main">
<header class="topbar"><div><div class="eyebrow">WORKSPACE / CRM</div><h1>Customers</h1><p class="muted">Manage customer accounts and contact details.</p></div><button class="theme-btn" onclick="toggleTheme()">◐ Theme</button></header>
<div th:if="${success}" class="alert success" th:text="${success}"></div><section class="panel"><h2>Add customer</h2><form class="form-grid" method="post" action="/customers"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email address" required><input name="company" placeholder="Company"><input name="phone" placeholder="Phone"><button class="primary-btn">Save customer</button></form></section>
<section class="panel"><h2>Customer directory</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Phone</th></tr></thead><tbody><tr th:each="c:${customers}"><td th:text="${c.name}"></td><td th:text="${c.email}"></td><td th:text="${c.company}"></td><td th:text="${c.phone}"></td></tr><tr th:if="${#lists.isEmpty(customers)}"><td colspan="4" class="empty">No customers added.</td></tr></tbody></table></div></section></main><script src="/js/app.js"></script></body></html>
