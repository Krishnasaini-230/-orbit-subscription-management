<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Products · Orbit</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: sidebar}"></div><main class="main">
<header class="topbar"><div><div class="eyebrow">CATALOG / PRODUCTS</div><h1>Products</h1><p class="muted">Create and manage what you sell.</p></div><button class="theme-btn" onclick="toggleTheme()">◐ Theme</button></header>
<div th:if="${success}" class="alert success" th:text="${success}"></div><section class="panel"><h2>New product</h2><form class="form-grid" method="post" action="/products"><input name="name" placeholder="Product name" required><select name="productType"><option>Service</option><option>Software</option><option>Physical</option></select><input name="salesPrice" type="number" min="0" step=".01" placeholder="Sales price" required><input name="costPrice" type="number" min="0" step=".01" placeholder="Cost price"><input name="notes" placeholder="Notes"><button class="primary-btn">Save product</button></form></section>
<section class="panel"><h2>Product catalog</h2><div class="table-wrap"><table><thead><tr><th>Product</th><th>Type</th><th>Sales price</th><th>Cost price</th><th>Notes</th></tr></thead><tbody><tr th:each="p:${products}"><td th:text="${p.name}"></td><td th:text="${p.productType}"></td><td th:text="${p.salesPrice}"></td><td th:text="${p.costPrice}"></td><td th:text="${p.notes}"></td></tr><tr th:if="${#lists.isEmpty(products)}"><td colspan="5" class="empty">No products yet.</td></tr></tbody></table></div></section></main><script src="/js/app.js"></script></body></html>
